name: Build CourseDeep APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (latest stable, SDK cached)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/**/*.gradle*', 'app/android/**/build.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Build arm64-only, obfuscated, minified release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --tree-shake-icons

      - name: Report APK sizes
        working-directory: app
        run: |
          echo "=== APK output ==="
          ls -lh build/app/outputs/flutter-apk/
          echo ""
          echo "=== Size table ==="
          for f in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$f" ] && printf "%-45s %s\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
          done

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursedeep-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
