name: Build CourseDeep APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        working-directory: app
        run: |
          if [ ! -d android ]; then
            echo "android/ folder not found in repo - generating it"
            flutter create --platforms=android --project-name coursedeep --org com.coursedeep .
          fi

      - name: Show Flutter version
        run: flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Build arm64-only, obfuscated, release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Report APK sizes
        working-directory: app
        run: |
          ls -lh build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$f" ] && printf "%-45s %s\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
          done

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursedeep-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
