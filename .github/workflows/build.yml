name: Build CourseDeep APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Compile C++ Native Library
        run: |
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          clang++ -shared -fPIC native/coursedeep.cpp -o app/android/app/src/main/jniLibs/arm64-v8a/libcoursedeep.so

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Upgrade Android Gradle Plugin, Gradle, name, and permissions
        working-directory: app/android
        run: |
          python3 - << 'PY'
          import re, glob, os

          AGP = "8.11.1"
          GRADLE = "8.14"
          APP_NAME = "CourseDeep"

          # 1. Bump Android Gradle Plugin (Groovy or Kotlin DSL)
          for f in glob.glob("*.gradle*") + glob.glob("app/*.gradle*"):
              s = open(f).read()
              n = re.sub(r'(com\.android\.application["\']\)?\s*version\s*["\'])[0-9.]+',
                         r'\g<1>' + AGP, s)
              n = re.sub(r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                         r'\g<1>' + AGP, n)
              if n != s:
                  open(f, "w").write(n)
                  print("Updated AGP in", f)

          # 2. Bump Gradle wrapper
          p = "gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(p):
              s = open(p).read()
              n = re.sub(r'gradle-[0-9.]+-(all|bin)\.zip', r'gradle-' + GRADLE + r'-\1.zip', s)
              if n != s:
                  open(p, "w").write(n)
                  print("Updated Gradle wrapper")

          # 3. Manifest: app name shown on the phone + internet permission
          m = "app/src/main/AndroidManifest.xml"
          if os.path.exists(m):
              s = open(m).read()
              s = re.sub(r'android:label="[^"]*"', 'android:label="' + APP_NAME + '"', s, count=1)
              if "android.permission.INTERNET" not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                             s, count=1)
              open(m, "w").write(s)
              print("Manifest set to", APP_NAME)
          PY

      - name: Build arm64-only, obfuscated, release APK
        working-directory: app
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Report APK sizes
        working-directory: app
        run: |
          ls -lh build/app/outputs/flutter-apk/
          for f in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$f" ] && printf "%-45s %s\n" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
          done

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursedeep-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
