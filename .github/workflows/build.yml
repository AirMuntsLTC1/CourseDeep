name: Build CourseDeep APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Make sure the Android project exists
        working-directory: app
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name coursedeep --org com.coursedeep .
          fi

      - name: Apply the CourseDeep logo + dark splash (replaces every Flutter icon)
        run: |
          RES=app/android/app/src/main/res
          cp -r branding/android-res/. "$RES/"
          # Android 5+ reads drawable-v21 first; the template has a WHITE one, so overwrite it
          mkdir -p "$RES/drawable-v21"
          cp branding/android-res/drawable/launch_background.xml "$RES/drawable-v21/launch_background.xml"
          ls "$RES"/mipmap-xxxhdpi

      # FIX: the old step used the Linux host compiler, which makes an x86 .so that Android
      # cannot load (the app silently fell back to Dart). Build with the Android NDK instead.
      - name: Compile C++ native library (Android NDK, arm64)
        run: |
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          "$CXX" -shared -fPIC -O2 -fvisibility=hidden -std=c++17 \
            -Wl,-z,max-page-size=16384 \
            native/coursedeep.cpp \
            -o app/android/app/src/main/jniLibs/arm64-v8a/libcoursedeep.so
          file app/android/app/src/main/jniLibs/arm64-v8a/libcoursedeep.so

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Upgrade Android Gradle Plugin, Gradle, name, and permissions
        working-directory: app/android
        run: |
          python3 - << 'PY'
          import re, glob, os

          AGP = "8.11.1"
          GRADLE = "8.14"
          APP_NAME = "CourseDeep"

          for f in glob.glob("*.gradle*") + glob.glob("app/*.gradle*"):
              s = open(f).read()
              n = re.sub(r'(com\.android\.application["\']\)?\s*version\s*["\'])[0-9.]+',
                         r'\g<1>' + AGP, s)
              n = re.sub(r'(com\.android\.tools\.build:gradle:)[0-9.]+',
                         r'\g<1>' + AGP, n)
              if n != s:
                  open(f, "w").write(n)
                  print("Updated AGP in", f)

          p = "gradle/wrapper/gradle-wrapper.properties"
          if os.path.exists(p):
              s = open(p).read()
              n = re.sub(r'gradle-[0-9.]+-(all|bin)\.zip', r'gradle-' + GRADLE + r'-\1.zip', s)
              if n != s:
                  open(p, "w").write(n)
                  print("Updated Gradle wrapper")

          m = "app/src/main/AndroidManifest.xml"
          if os.path.exists(m):
              s = open(m).read()
              s = re.sub(r'android:label="[^"]*"', 'android:label="' + APP_NAME + '"', s, count=1)
              if "android:roundIcon" not in s:
                  s = s.replace('android:icon="@mipmap/ic_launcher"',
                                'android:icon="@mipmap/ic_launcher"\n        android:roundIcon="@mipmap/ic_launcher_round"', 1)
              if "android.permission.INTERNET" not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                             s, count=1)
              # Android 11+: lets the app open source links in the browser / other apps
              if "<queries>" not in s:
                  s = s.replace("<application",
                      '<queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n'
                      '        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="http" /></intent>\n'
                      '    </queries>\n    <application', 1)
              open(m, "w").write(s)
              print("Manifest patched:", APP_NAME)
          PY

      - name: Build arm64-only, obfuscated, release APK
        working-directory: app
        env:
          SUPABASE_URL: https://zbwmmmstzlgjmhhoceiv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing GitHub secret: SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Report APK sizes
        working-directory: app
        run: |
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: coursedeep-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

